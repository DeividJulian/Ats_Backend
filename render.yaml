services:
  - type: web
    name: ats-backend
    runtime: python
    plan: free
    # Same AWS area as the Neon database (us-east-1), to keep queries fast
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALLOW_DATA_RESET
        value: "false"
      # Optional language model: Groq (free tier, fast); the key is entered in Render, never in the repo
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      # Signs the session tokens and the codes; Render generates a random value once
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_HORAS
        value: "12"
      # Login codes go out through Brevo's HTTP API (the free plan blocks SMTP ports)
      - key: EMAIL_BACKEND
        value: brevo
      # A sender verified in Brevo, and the API key; both entered in Render, never in the repo
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Portal ATS
      - key: BREVO_API_KEY
        sync: false
      - key: CODIGO_MINUTOS
        value: "10"
      - key: CODIGO_INTENTOS
        value: "5"
      - key: CODIGO_ESPERA_SEGUNDOS
        value: "30"
      # First administrator, created on startup if it doesn't exist; enters with the code sent to that email
      - key: ADMIN_EMAIL
        sync: false
