services:
  - type: web
    name: ats-backend
    runtime: python
    plan: free
    # Same AWS area as the Neon database (us-east-1), to keep queries fast
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALLOW_DATA_RESET
        value: "false"
      # Optional language model: Gemini by default (free tier); the key is entered in Render, never in the repo
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      # Signs the session tokens; Render generates a random value once
      - key: JWT_SECRET
        generateValue: true
      # First administrator, created on startup if it doesn't exist
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
